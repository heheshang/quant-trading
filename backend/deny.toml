# cargo-deny dependency audit configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Advisory database is fetched from GitHub
ignore = [
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained - no safe upgrade
    # RUSTSEC-2024-0437: protobuf 2.28.0 (transitive via prometheus 0.13.4) can
    # stack-overflow on untrusted protobuf input. We do NOT use the protobuf
    # feature of `prometheus` (only IntCounterVec/IntGaugeVec/HistogramVec), so
    # the vulnerable code path is unreachable. Upgrading to prometheus 0.14
    # is an API-breaking change; revisit when we migrate.
    "RUSTSEC-2024-0437",
]

[licenses]
# Allow common open-source licenses. The set is intentionally
# minimal: every entry is verified against the actual dependency
# graph by `cargo-deny check licenses`. If you add a license here
# that no current dependency uses, `cargo-deny` will warn
# `license-not-encountered` so it can be removed.
allow = [
    "MIT",
    "Apache-2.0",
    "0BSD",            # quoted_printable (lettre) — OSI-approved BSD Zero Clause
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots (reqwest → hyper-rustls)
    "BSL-1.0",
    "Zlib",
]
confidence-threshold = 0.6

[licenses.private]
# Treat the workspace's own crate as MIT/Apache-2.0 for audit
# purposes; do not require it to be declared as an outbound dep.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
