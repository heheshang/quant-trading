[package]
name = "quant-trading-backend"
version = "0.1.0"
edition = "2024"
description = "Quantitative Trading System Backend"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["ssk <ssk@local>"]
publish = false

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Async streams
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "macros",
    "runtime-tokio-rustls",
    "with-json",
    "with-chrono",
    "with-uuid",
] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls"] }

# Auth
jsonwebtoken = "9"
bcrypt = "0.16"

# HTTP middleware
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# OpenTelemetry — distributed tracing (P0-运维)
# Pipeline: tracing → tracing-opentelemetry → opentelemetry-otlp → Jaeger (gRPC OTLP :4317)
# Resource service.name = "quant-trading-backend" (configured in init_tracing).
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = "0.28"

# WebSocket
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "native-tls"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Decimal numeric storage
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
bigdecimal = "0.4"  # kept for existing migrations

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Secrets
secrecy = "0.10"

# Environment
dotenvy = "0.15"

tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
anyhow = "1"
rand = "~0.8"
csv = "1.3"
zip = "2.4"

# Redis cache
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }

# HTTP client for Binance REST API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Crypto for API signing
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dashmap = "6"

# CLI
clap = { version = "4", features = ["derive"] }
url = "2"

# IP / CIDR parsing for the admin IP whitelist (P3-A).
# `ipnetwork` supports IPv4 + IPv6 single hosts and CIDR blocks.
ipnetwork = { version = "0.20", features = ["serde"] }

# 2FA / TOTP (P3-B) — RFC 6238 TOTP secret generation + code verification.
# Feature `qr` enables built-in QR PNG generation via `qrcodegen-image`,
# but we use the separate `qrcode` crate to produce the otpauth:// PNG
# the front-end renders in LoginView. Both deps kept to keep the
# generation path independent and testable.
totp-rs = { version = "5", features = ["otpauth", "qr", "rand", "gen_secret", "serde"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
# `image` is used by `services::totp` to encode the QR PNG (GrayImage →
# PngEncoder). It's already a transitive dep via qrcode + totp-rs, but
# we declare it explicitly so the import paths in `totp.rs` are stable.
image = { version = "0.25", default-features = false, features = ["png"] }

# Email
lettre = "0.11"
native-tls = "0.2"

# Metrics / Prometheus exposition
prometheus = "0.13"

# OpenAPI client generation (P3-3).
# utoipa derives the OpenAPI 3.1 spec from `#[derive(ToSchema)]` on the
# request/response DTOs and `#[utoipa::path]` on the handler functions.
# `utoipa-axum` integrates with axum 0.8 routers; `utoipa-swagger-ui`
# serves the Swagger UI page from the generated `ApiDoc`.
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "macros"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# Message Queue — RabbitMQ (lapin)
# P3-2: 引入 MQ 解耦 AI 预测 / 通知 / 风控日志三条高频调用链
#   lapin = AMQP 0-9-1 客户端（官方维护）
#   deadpool-lapin = lapin Connection 池（多 worker 共用一个连接池，避免每请求握手）
lapin = "2.5"
deadpool-lapin = "0.12"

# Sentry — error aggregation (运维-2)
# 三个 crate 协同：
#   - `sentry`        : 主 SDK，初始化 + 错误捕获 + 事件发送
#   - `sentry-tracing`: 把 `tracing::error!` / `tracing::warn!` 自动转 Sentry event
#   - `sentry-tower`  : Tower middleware，自动捕获 axum 5xx + panic
# `reqwest` + `rustls` feature 避免引入系统 OpenSSL，使 Docker 镜像更小。
# 关闭 `sentry` 时整个 init 走 noop 分支（见 `observability::sentry`），
# 所以 SENTRY_DSN 不配置时几乎零成本。
sentry = { version = "0.48", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
    "release-health",
    "transport",
] }
sentry-tracing = "0.48"
sentry-tower = { version = "0.48", features = ["axum"] }

# pprof — CPU + heap profiling 端点 (运维-2)
# 用作 dev/staging 暴露的 `/debug/pprof/*` 端点的实现：
#   - `flamegraph` feature 引入 `inferno`，生成 SVG 火焰图
#   - `protobuf-codec` 让 CPU profile 输出 protobuf 格式（与 Go pprof 工具兼容）
#   - `frame-pointer` 让 release 也能 unwinding（默认不开）
# 在生产构建里仍会编译（出于分发一致性），但路由在 `APP_ENV=production` 时
# 不挂载（见 `handlers::pprof` + `main.rs` 条件 merge）。
pprof = { version = "0.15", features = [
    "flamegraph",
    "protobuf-codec",
    "frame-pointer",
] }

[[bin]]
name = "stress-test"
path = "src/bin/stress_test/main.rs"

[features]
# P3-6: TimescaleDB integration tests (gated feature)
# When enabled, `cargo test --features tsdb-integration` will compile
# `services::kline_test::integration::*` — these tests require a running
# TimescaleDB instance (DATABASE_URL must point at timescale/timescaledb).
# Default `cargo test` skips them, keeping dev-machine runs fast.
tsdb-integration = []

[dev-dependencies]
mockall = "0.13"
rstest = "0.24"
tokio-test = "0.4"
axum-test = "16"
tracing-test = "0.2"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
