[package]
name = "quant-trading-backend"
version = "0.1.0"
edition = "2024"
description = "Quantitative Trading System Backend"
rust-version = "1.95"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Async streams
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "macros",
    "runtime-tokio-rustls",
    "with-json",
    "with-chrono",
    "with-uuid",
] }

# Auth
jsonwebtoken = "9"
bcrypt = "0.16"

# HTTP middleware
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# WebSocket
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls", "native-tls"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Decimal numeric storage
rust_decimal = "1.36"
bigdecimal = "0.4"  # kept for existing migrations

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Secrets
secrecy = "0.10"

# Environment
dotenvy = "0.15"

tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
anyhow = "1"
rand = "~0.8"
csv = "1.3"

# Redis cache
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }

# HTTP client for Binance REST API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
rstest = "0.24"
tokio-test = "0.4"
axum-test = "16"
tracing-test = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
