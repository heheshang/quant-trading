# .cargo/config.toml
[source.crates-io]
replace-with = 'bytedance'  # 中科大镜像

# 中科大镜像（sparse）
[source.ustc]
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"

[source.bytedance]
registry = "sparse+https://rsproxy.cn/index/"
# Build configuration for faster compilation

[build]
# Use 4 jobs to avoid OOM on memory-constrained system (15GB RAM, 6 cores)
jobs = 4
incremental = true

[profile.dev]
opt-level = 0
debug = false
# Split debuginfo is slower to build, disable it
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0

[profile.release]
# Keep existing settings from Cargo.toml
# opt-level = 3, lto = true, codegen-units = 1
