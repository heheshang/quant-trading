# .cargo/config.toml

# Use Chinese mirror (USTC) for faster crate downloads in China
[source.crates-io]
replace-with = 'ustc'

[source.ustc]
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"

[build]
# Use 4 jobs to avoid OOM on memory-constrained system (15GB RAM, 6 cores)
jobs = 4
incremental = true

[profile.dev]
opt-level = 0
debug = false
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0

[profile.release]
# Keep existing settings from Cargo.toml
