services:
  # ─── Backend (Rust Axum) ────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quant-backend
    restart: unless-stopped
    ports:
      - "8083:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://quant:***@postgres:5432/quant_trading
      - REDIS_URL=redis://redis:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - CORS_ORIGINS=http://localhost:80,http://localhost:8081,http://localhost:5173
      - INITIAL_BALANCE=100000
      - FEE_RATE=0.001
      - TRADE_MODE=paper
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quant-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Frontend (Vue SPA via Nginx) ────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: quant-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quant-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── PostgreSQL ────
  postgres:
    image: postgres:16-alpine
    container_name: quant-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-init/postgres:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: quant_trading
    # ports removed for security (internal network only)
    networks:
      - quant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis ────
  redis:
    image: redis:7-alpine
    container_name: quant-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # ports removed for security (internal network only)
    networks:
      - quant-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  quant-network:
    name: quant-trading-network
    driver: bridge

volumes:
  postgres-data:
    name: quant-postgres-data
  redis-data:
    name: quant-redis-data
