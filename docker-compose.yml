services:
  # ─── Backend (Rust Axum) ────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quant-backend
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - CORS_ORIGINS=http://localhost:80,http://localhost:8081,http://localhost:5173
      - INITIAL_BALANCE=100000
      - FEE_RATE=0.001
      - TRADE_MODE=paper
      - AI_MODEL_SERVICE_URL=http://ai-service:8001
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-quant}:${RABBITMQ_PASSWORD:-quant_mq_2024}@rabbitmq:5672/%2f
      - MQ_ENABLED=${MQ_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - quant-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health && curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/health | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── AI Service (Python FastAPI) ────
  ai-service:
    build:
      context: ./python-ai-service
      dockerfile: Dockerfile
    container_name: quant-ai-service
    restart: unless-stopped
    expose:
      - "8001"
    ports:
      - "8002:8001"
    environment:
      - PORT=8001
      - MODEL_VERSION=${AI_MODEL_VERSION:-v1.0.0}
      - USE_MOCK=${AI_USE_MOCK:-true}
    networks:
      - quant-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Frontend (Vue SPA via Nginx) ────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8081/api/v1
    container_name: quant-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quant-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── TimescaleDB (PostgreSQL + time-series extension) ────
  # P3-6: 时序表分区 — K线 / 订单 / 风控事件 走 TimescaleDB hypertable，
  # 启用自动按时间分块 + 压缩老 chunk + 1 年 retention + 1m/5m/1h 连续聚合。
  # 镜像基于 postgres:16，drop-in 替换 (DATABASE_URL 完全不变)。
  # healthcheck 改用 psql 验证 timescaledb extension 加载 (DO $$ ... $$)。
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: quant-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-init/postgres:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quant_trading
      # TimescaleDB tuning — 让 hypertable 后台 worker / bgw 有资源跑
      # 压缩 / 保留 / 连续聚合刷新任务
      TS_TUNE_MEMORY: "4GB"
      TS_TUNE_NUM_CPUS: "2"
    networks:
      - quant-network
    healthcheck:
      # pg_isready + 一次 SELECT 确认 timescaledb extension 可用
      test:
        - "CMD-SHELL"
        - "pg_isready -U quant -d quant_trading && psql -U quant -d quant_trading -c \"SELECT extname FROM pg_extension WHERE extname='timescaledb'\" | grep -q timescaledb"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── RabbitMQ (Message Queue, P3-2) ────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: quant-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-quant}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-quant_mq_2024}
    networks:
      - quant-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis ────
  redis:
    image: redis:7-alpine
    container_name: quant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # ports removed for security (internal network only)
    networks:
      - quant-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-} --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  quant-network:
    name: quant-trading-network
    driver: bridge

volumes:
  postgres-data:
    name: quant-postgres-data
  redis-data:
    name: quant-redis-data
  rabbitmq-data:
    name: quant-rabbitmq-data
