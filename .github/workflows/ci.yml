name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: Lint & Check ────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy -- -D warnings

  # ─── Backend: Build ────
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

  # ─── Backend: Test ────
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quant_trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/quant_trading_test
          REDIS_URL: redis://localhost:6379
          CORS_ORIGINS: http://localhost:5173

  # ─── Frontend: Lint & Type Check ────
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

  # ─── Frontend: Test ────
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  # ─── Frontend: Build ────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ─── Security: Cargo Audit ────
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  # ─── Security: NPM Audit ────
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  # ─── Security: Gitleaks ────
  gitleaks:
    name: Gitleaks (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Docker: Build Images ────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t quant-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t quant-frontend:ci .

      - name: Verify backend healthcheck
        run: |
          docker network create quant-ci-network
          docker run -d --name quant-postgres-ci \
            --network quant-ci-network \
            -e POSTGRES_USER=quant \
            -e POSTGRES_PASSWORD=ci_test_pw \
            -e POSTGRES_DB=quant_trading \
            postgres:16-alpine
          docker run -d --name quant-redis-ci \
            --network quant-ci-network \
            redis:7-alpine
          sleep 5
          docker run -d --name quant-backend-ci \
            --network quant-ci-network \
            -e DATABASE_URL="postgres://quant:ci_test_pw@quant-postgres-ci:5432/quant_trading" \
            -e REDIS_URL="redis://quant-redis-ci:6379" \
            -e JWT_SECRET=ci-test-secret-for-github-actions-min-32chars \
            -e CORS_ORIGINS="http://localhost:80" \
            quant-backend:ci
          sleep 10
          docker exec quant-backend-ci curl -f http://localhost:8080/api/v1/health || (docker logs quant-backend-ci && exit 1)

      - name: Verify market API endpoints
        run: |
          # Register test user
          docker exec quant-backend-ci curl -sf -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"market_tester","password":"Test1234!","email":"market@test.com"}' \
            || echo "User may already exist, continuing..."

          # Login and capture token
          TOKEN=$(docker exec quant-backend-ci curl -sf -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"market_tester","password":"Test1234!"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['access_token'])")
          echo "Access token acquired"

          # Test GET /api/v1/market/tickers
          docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/v1/market/tickers
          echo "Market tickers endpoint OK"

          # Test GET /api/v1/market/ticker?symbol=BTCUSDT
          docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            'http://localhost:8080/api/v1/market/ticker?symbol=BTCUSDT'
          echo "Market ticker (single) endpoint OK"

          # Test GET /api/v1/market/depth?symbol=BTCUSDT&levels=5
          docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            'http://localhost:8080/api/v1/market/depth?symbol=BTCUSDT&levels=5'
          echo "Market depth endpoint OK"

          # Test GET /api/v1/market/ticker/history?symbol=BTCUSDT&start=0&end=0
          docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            'http://localhost:8080/api/v1/market/ticker/history?symbol=BTCUSDT&start=0&end=0' || \
            echo "Ticker history endpoint (P1, expected to return error for no data)"
          echo "Market API verification complete"

          # ── Portfolio API verification ──
          # Test unauthenticated access returns 401 (proves route exists)
          HTTP_CODE=$(docker exec quant-backend-ci curl -sf -o /dev/null -w '%{http_code}' \
            http://localhost:8080/api/v1/portfolio/summary)
          if [ "$HTTP_CODE" = "401" ]; then echo "Portfolio summary unauth → 401 OK"; else echo "WARNING: Portfolio summary unauth → $HTTP_CODE (expected 401)"; fi

          HTTP_CODE=$(docker exec quant-backend-ci curl -sf -o /dev/null -w '%{http_code}' \
            http://localhost:8080/api/v1/portfolio/positions)
          if [ "$HTTP_CODE" = "401" ]; then echo "Portfolio positions unauth → 401 OK"; else echo "WARNING: Portfolio positions unauth → $HTTP_CODE (expected 401)"; fi

          HTTP_CODE=$(docker exec quant-backend-ci curl -sf -o /dev/null -w '%{http_code}' \
            http://localhost:8080/api/v1/portfolio/performance)
          if [ "$HTTP_CODE" = "401" ]; then echo "Portfolio performance unauth → 401 OK"; else echo "WARNING: Portfolio performance unauth → $HTTP_CODE (expected 401)"; fi

          # Test authenticated access
          docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/v1/portfolio/summary
          echo "Portfolio summary (auth) endpoint OK"

          docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/v1/portfolio/performance
          echo "Portfolio performance (auth) endpoint OK"

          docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/v1/portfolio/positions
          echo "Portfolio positions (auth) endpoint OK"

          echo "Portfolio API verification complete"

          # ── Order API verification ──
          # Test unauthenticated access returns 401 (proves route exists)
          HTTP_CODE=$(docker exec quant-backend-ci curl -sf -o /dev/null -w '%{http_code}' \
            http://localhost:8080/api/v1/orders)
          if [ "$HTTP_CODE" = "401" ]; then echo "Orders unauth → 401 OK"; else echo "WARNING: Orders unauth → $HTTP_CODE (expected 401)"; fi

          HTTP_CODE=$(docker exec quant-backend-ci curl -sf -o /dev/null -w '%{http_code}' \
            http://localhost:8080/api/v1/positions)
          if [ "$HTTP_CODE" = "401" ]; then echo "Positions unauth → 401 OK"; else echo "WARNING: Positions unauth → $HTTP_CODE (expected 401)"; fi

          HTTP_CODE=$(docker exec quant-backend-ci curl -sf -o /dev/null -w '%{http_code}' \
            http://localhost:8080/api/v1/account)
          if [ "$HTTP_CODE" = "401" ]; then echo "Account unauth → 401 OK"; else echo "WARNING: Account unauth → $HTTP_CODE (expected 401)"; fi

          # Test authenticated access
          docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/v1/orders
          echo "Orders (auth) endpoint OK"

          docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/v1/account
          echo "Account (auth) endpoint OK"

          # Init paper account for order testing
          docker exec quant-backend-ci curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            http://localhost:8080/api/v1/account/init
          echo "Account init endpoint OK"

          docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/v1/symbols
          echo "Symbols endpoint OK"

          echo "Order API verification complete"

      - name: Cleanup CI containers
        if: always()
        run: |
          docker rm -f quant-backend-ci quant-postgres-ci quant-redis-ci 2>/dev/null || true
          docker network rm quant-ci-network 2>/dev/null || true
