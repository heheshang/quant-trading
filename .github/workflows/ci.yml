name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Backend: Format Check ────
  backend-fmt:
    name: Backend Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

  # ─── Backend: Clippy Lint ────
  backend-clippy:
    name: Backend Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy lint
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings

  # ─── Backend: cargo-deny (licenses, advisories, banned crates) ────
  backend-deny:
    name: Backend cargo-deny
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deny

      - name: cargo-deny check
        run: cargo deny check -d

  # ─── Backend: Typo check ────
  backend-typos:
    name: Backend Typo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run typos
        uses: crate-ci/typos@v1
        with:
          format: downstream

  # ─── Backend: Build ────
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

  # ─── Backend: Test ────
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quant_trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test
        env:
          DATABASE_URL: postgres://postgres:***@localhost:5432/quant_trading_test
          REDIS_URL: redis://localhost:***@v4

      - name: Upload coverage
        if: success() && matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/target/llvm-cov/profdata/

  # ─── Frontend: TypeScript + Lint ────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ─── Frontend: Test ────
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  # ─── Frontend: Build ────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ─── Security: Cargo Audit ────
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  # ─── Security: NPM Audit ────
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  # ─── Security: Gitleaks ────
  gitleaks:
    name: Gitleaks (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Docker: Build Images ────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t quant-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t quant-frontend:ci .

      - name: Verify backend healthcheck
        run: |
          docker network create quant-ci-network
          docker run -d --name quant-postgres-ci \
            --network quant-ci-network \
            -e POSTGRES_USER=quant \
            -e POSTGRES_PASSWORD=ci_test_pw \
            -e POSTGRES_DB=quant_trading \
            postgres:16-alpine
          docker run -d --name quant-redis-ci \
            --network quant-ci-network \
            redis:7-alpine
          sleep 5
          docker run -d --name quant-backend-ci \
            --network quant-ci-network \
            -e DATABASE_URL="postgres://quant:***@quant-postgres-ci:5432/quant_trading" \
            -e REDIS_URL="redis://quant-redis-ci:***@test.com" \
            quant-backend:ci || true

          # Test unauthenticated endpoints (should return 401)
          HTTP_CODE=$(docker exec quant-backend-ci curl -sf -o /dev/null -w '%{http_code}' \
            http://localhost:8080/api/v1/portfolio/summary)
          [ "$HTTP_CODE" = "401" ] && echo "Portfolio summary unauth → 401 OK"

          # Test authenticated market endpoints
          TOKEN=$(docker exec quant-backend-ci curl -sf -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"market_tester","password":"Test1234!"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['access_token'])" 2>/dev/null || echo "skip")
          [ "$TOKEN" != "skip" ] && docker exec quant-backend-ci curl -sf -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/v1/market/tickers && echo "Market tickers OK"

      - name: Cleanup CI containers
        if: always()
        run: |
          docker rm -f quant-backend-ci quant-postgres-ci quant-redis-ci 2>/dev/null || true
          docker network rm quant-ci-network 2>/dev/null || true
