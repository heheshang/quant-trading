name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Backend: Format Check ────
  backend-fmt:
    name: Backend Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

  # ─── Backend: Clippy Lint ────
  backend-clippy:
    name: Backend Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy lint
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings

  # ─── Backend: cargo-deny (licenses, advisories, banned crates) ────
  backend-deny:
    name: Backend cargo-deny
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deny

      - name: cargo-deny check
        run: cargo deny check -d

  # ─── Backend: Typo check ────
  backend-typos:
    name: Backend Typo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run typos
        uses: crate-ci/typos@v1
        with:
          format: toml
          config: .typos.toml

  # ─── Backend: Build ────
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

  # ─── Backend: Test + Coverage ────
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quant_trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/cargo-llvm-cov-action@v3
        with:
          version: latest

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done

      - name: Run tests with coverage
        run: cargo llvm-cov test --lcov --output-path lcov.info
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/quant_trading_test
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/lcov.info

  # ─── Backend: Coverage Gate ────
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: backend/

      - name: Install cargo-llvm-cov
        uses: taiki-e/cargo-llvm-cov-action@v3
        with:
          version: latest

      - name: Check overall coverage (threshold 70%)
        run: cargo llvm-cov report --lcov-path backend/lcov.info --fail-under-lines 70 || true

      - name: Check handlers coverage (threshold 90%)
        run: |
          cargo llvm-cov report --lcov-path backend/lcov.info \
            --filter 'backend/src/handlers/**' \
            --fail-under-lines 90 || exit 1

      - name: Check services coverage (threshold 75%)
        run: |
          cargo llvm-cov report --lcov-path backend/lcov.info \
            --filter 'backend/src/services/**' \
            --fail-under-lines 75 || exit 1

      - name: Check db coverage (threshold 70%)
        run: |
          cargo llvm-cov report --lcov-path backend/lcov.info \
            --filter 'backend/src/db/**' \
            --fail-under-lines 70 || exit 1

  # ─── Frontend: TypeScript + Lint ────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ─── Frontend: Test ────
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm run test

  # ─── Frontend: Build ────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

  # ─── Security: NPM Audit ────
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit
        run: npm audit --audit-level=high

  # ─── Security: Gitleaks ────
  gitleaks:
    name: Gitleaks (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Docker: Build Images ────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t quant-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t quant-frontend:ci .

      - name: Start dependencies
        run: |
          docker network create quant-ci-network 2>/dev/null || true
          docker run -d --name quant-postgres-ci \
            --network quant-ci-network \
            -e POSTGRES_USER=quant \
            -e POSTGRES_PASSWORD=ci_test_pw \
            -e POSTGRES_DB=quant_trading \
            postgres:16-alpine
          docker run -d --name quant-redis-ci \
            --network quant-ci-network \
            redis:7-alpine
          for i in $(seq 1 15); do
            pg_isready -h quant-postgres-ci -p 5432 -U quant && break
            sleep 1
          done
          docker exec quant-redis-ci redis-cli -a ci_test_pw --no-auth-warning ping | grep -q PONG || true

      - name: Run backend container and verify
        run: |
          docker run -d --name quant-backend-ci \
            --network quant-ci-network \
            -e DATABASE_URL="postgres://quant:ci_test_pw@quant-postgres-ci:5432/quant_trading" \
            -e REDIS_URL="redis://:ci_test_pw@quant-redis-ci:6379" \
            -e SERVER_HOST=0.0.0.0 \
            -e SERVER_PORT=8080 \
            -e RUST_LOG=info \
            quant-backend:ci || { echo "Container failed to start"; docker logs quant-backend-ci; exit 1; }

          sleep 10
          docker exec quant-backend-ci ls /app/server 2>/dev/null && echo "Binary exists OK"

          HTTP_CODE=$(docker exec quant-backend-ci sh -c 'wget -qO- --timeout=5 http://localhost:8080/api/v1/portfolio/summary 2>/dev/null || echo "000" | head -c 3')
          echo "Portfolio summary response code: $HTTP_CODE"

          docker stop quant-backend-ci || true

      - name: Cleanup CI containers
        if: always()
        run: |
          docker rm -f quant-backend-ci quant-postgres-ci quant-redis-ci 2>/dev/null || true
          docker network rm quant-ci-network 2>/dev/null || true
